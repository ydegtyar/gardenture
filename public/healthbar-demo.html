<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gardenture — AAA Roguelite Botanical Health Bar</title>
  <style>
    :root {
      --hp-pct: 100%;
      --ghost-pct: 100%;
      --shield-pct: 0%;

      --hp-color-start: #ff2a55;
      --hp-color-mid: #fbbf24;
      --hp-color-end: #5eff8f;

      --hp-critical-start: #4a0414;
      --hp-critical-mid: #990022;
      --hp-critical-end: #ff1e42;

      --ghost-color-start: #fffbeb;
      --ghost-color-end: #fde047;

      --shield-color-start: #e2e8f0;
      --shield-color-end: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 24px;
      background: radial-gradient(circle at 50% 35%, #231729 0%, #120b16 65%, #09050b 100%);
      color: #ede6d0;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
    }

    .showcase-card {
      width: 100%;
      max-width: 580px;
      padding: 32px 28px;
      border-radius: 20px;
      background: rgba(20, 13, 24, 0.88);
      border: 1.5px solid rgba(232, 182, 74, 0.35);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .showcase-header {
      text-align: center;
    }

    .showcase-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #fff6c4;
      letter-spacing: 0.02em;
    }

    .showcase-readout {
      margin-top: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      color: #cbd5e1;
    }

    /* 1. Container (.hud-healthbar) */
    .hud-healthbar {
      position: relative;
      width: 100%;
      max-width: 440px;
      aspect-ratio: 640 / 108;
      user-select: none;
      transform: none;
    }

    .hud-healthbar::after,
    .hud-healthbar .healthbar-frame-overlay {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      background-image: url("/healthbar-frame.png");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      pointer-events: none;
    }

    /* 2. Meter Track (.hp-track) */
    .hp-track {
      position: absolute;
      left: 15.625%;
      top: 36.111%;
      width: 79.6875%;
      height: 27.778%;
      border-radius: 9999px;
      overflow: hidden;
      z-index: 1;
      background: linear-gradient(180deg, #0b060d 0%, #19101c 55%, #0e0811 100%);
      box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.85), inset 0 -1px 3px rgba(255, 246, 196, 0.12);
      transition: box-shadow 0.25s ease;
      transform: none;
    }

    /* Layer 1: .hp-ghost-fill */
    .hp-ghost-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--ghost-pct, 100%);
      height: 100%;
      border-radius: inherit;
      z-index: 1;
      background: linear-gradient(90deg, var(--ghost-color-start) 0%, var(--ghost-color-end) 100%);
      box-shadow: 0 0 10px rgba(253, 224, 71, 0.65);
      transition: width 0.6s ease-out 0.2s;
    }

    /* Layer 2: .hp-main-fill */
    .hp-main-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--hp-pct, 100%);
      height: 100%;
      border-radius: inherit;
      z-index: 2;
      background: linear-gradient(
        90deg,
        var(--hp-color-start) 0%,
        var(--hp-color-mid) 48%,
        var(--hp-color-end) 100%
      );
      box-shadow: inset 0 2px 3px rgba(255, 255, 255, 0.38), inset 0 -2px 4px rgba(0, 0, 0, 0.45);
      transition: width 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.25s ease;
      overflow: hidden;
    }

    .hp-main-fill::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.28) 45%,
        rgba(255, 255, 255, 0.48) 50%,
        rgba(255, 255, 255, 0.28) 55%,
        transparent 80%
      );
      background-size: 200% 100%;
      animation: hp-liquid-shimmer 3.2s linear infinite;
      pointer-events: none;
    }

    .hp-main-fill::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.85) 50%,
        transparent 100%
      );
      transform: translateX(-120%);
      opacity: 0;
      pointer-events: none;
    }

    /* Layer 3: .shield-fill */
    .shield-fill {
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--shield-pct, 0%);
      height: 100%;
      border-radius: inherit;
      z-index: 3;
      background-image:
        url("/shield-overlay.png"),
        repeating-linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.38) 0px,
          rgba(255, 255, 255, 0.38) 10px,
          rgba(226, 232, 240, 0.08) 10px,
          rgba(226, 232, 240, 0.08) 22px
        ),
        linear-gradient(90deg, var(--shield-color-start) 0%, var(--shield-color-end) 100%);
      background-size: 180px 100%, 100% 100%, 100% 100%;
      background-blend-mode: screen, overlay, normal;
      opacity: 0.76;
      border-right: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.8), inset 0 1px 3px rgba(255, 255, 255, 0.75);
      transition: width 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease;
      pointer-events: none;
    }

    .shield-fill[data-empty="true"] {
      border-right-width: 0;
      box-shadow: none;
    }

    /* 3. Heart Socket (.heart-icon) */
    .heart-icon {
      position: absolute;
      left: 5.6125%;
      top: 24%;
      width: 8.775%;
      height: 52%;
      z-index: 4;
      background-image: url("/heart-emblem.png");
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      transform-origin: 50% 50%;
      transform: scale(1);
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.65));
      transition: filter 0.25s ease;
      pointer-events: none;
    }

    @keyframes hp-liquid-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Shield Active State (.has-shield) & Break (.shield-shatter) */
    .hud-healthbar.has-shield .hp-track {
      box-shadow: 0 0 12px #38bdf8, inset 0 0 8px #e2e8f0;
    }

    .hud-healthbar.has-shield .heart-icon {
      filter: grayscale(100%) brightness(1.35) contrast(1.4) drop-shadow(0 0 8px #e2e8f0);
    }

    @keyframes shield-shatter-track {
      0% {
        box-shadow: 0 0 26px #ffffff, 0 0 40px #38bdf8, inset 0 0 20px #ffffff;
        filter: brightness(1.9) contrast(1.3);
      }
      45% {
        box-shadow: 0 0 18px #38bdf8, inset 0 0 12px #e2e8f0;
        filter: brightness(1.4);
      }
      100% {
        box-shadow: inset 0 3px 6px rgba(0, 0, 0, 0.85);
        filter: brightness(1);
      }
    }

    @keyframes shield-shatter-heart {
      0% {
        filter: grayscale(100%) brightness(2.2) contrast(1.6) drop-shadow(0 0 18px #ffffff) drop-shadow(0 0 26px #38bdf8);
      }
      100% {
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
      }
    }

    .hud-healthbar.shield-shatter .hp-track {
      animation: shield-shatter-track 300ms ease-out forwards;
    }

    .hud-healthbar.shield-shatter .heart-icon {
      animation: shield-shatter-heart 300ms ease-out forwards;
    }

    /* Damage Taken (.is-damaged) — Heart-only pulse, bar stays static */
    @keyframes heart-damage-pulse {
      0% {
        transform: scale(1);
        filter: brightness(2.6) saturate(0.25) drop-shadow(0 0 16px #ffffff) drop-shadow(0 0 22px #ff2a55);
      }
      30% {
        transform: scale(0.8);
        filter: brightness(1.9) contrast(1.5) drop-shadow(0 0 14px #ff2a55);
      }
      70% {
        transform: scale(1.16);
        filter: brightness(1.3) drop-shadow(0 0 10px #ff2a55);
      }
      100% {
        transform: scale(1);
      }
    }

    .hud-healthbar.is-damaged .heart-icon {
      animation: heart-damage-pulse 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Healing State (.is-healing) */
    @keyframes heart-heal-double-thump {
      0% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px #4ade80);
      }
      22% {
        transform: scale(1.25);
        filter: brightness(1.2) drop-shadow(0 0 12px #4ade80);
      }
      44% {
        transform: scale(1.05);
        filter: brightness(1.08) drop-shadow(0 0 8px #4ade80);
      }
      68% {
        transform: scale(1.3);
        filter: brightness(1.28) drop-shadow(0 0 14px #4ade80);
      }
      100% {
        transform: scale(1);
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.65));
      }
    }

    @keyframes hp-heal-pulse-wave {
      0% { transform: translateX(-110%); opacity: 0.95; }
      75% { opacity: 0.85; }
      100% { transform: translateX(115%); opacity: 0; }
    }

    .hud-healthbar.is-healing .heart-icon {
      animation: heart-heal-double-thump 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .hud-healthbar.is-healing .hp-main-fill::after {
      animation: hp-heal-pulse-wave 550ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* Low Health Status (< 25% HP, .is-critical) */
    @keyframes heart-critical-loop {
      0%, 100% { transform: scale(1); }
      18% { transform: scale(1.22); }
      34% { transform: scale(1.04); }
      52% { transform: scale(1.28); }
      78% { transform: scale(1); }
    }

    .hud-healthbar.is-critical .hp-track {
      box-shadow: inset 0 0 10px #ff0033;
    }

    .hud-healthbar.is-critical.has-shield .hp-track {
      box-shadow: 0 0 12px #38bdf8, inset 0 0 10px #ff0033;
    }

    .hud-healthbar.is-critical .hp-main-fill {
      background: linear-gradient(
        90deg,
        var(--hp-critical-start) 0%,
        var(--hp-critical-mid) 50%,
        var(--hp-critical-end) 100%
      );
      box-shadow: 0 0 10px rgba(255, 0, 51, 0.65), inset 0 1px 2px rgba(255, 180, 195, 0.35);
    }

    .hud-healthbar.is-critical:not(.is-damaged):not(.is-healing) .heart-icon {
      animation: heart-critical-loop 0.65s cubic-bezier(0.25, 0.9, 0.35, 1) infinite;
    }

    /* Demo Controls */
    .demo-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .demo-btn {
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      color: #fffdf0;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .demo-btn:hover { filter: brightness(1.12); }
    .demo-btn:active { transform: scale(0.96); }

    .btn-damage { background: #4c1120; border-color: #ff2a55; }
    .btn-heal { background: #103826; border-color: #4ade80; }
    .btn-shield { background: #102a42; border-color: #38bdf8; }
    .btn-critical { background: #2c1a32; border-color: #e8b64a; }
    .btn-critical[aria-pressed="true"] { background: #6b0018; border-color: #ff0033; box-shadow: 0 0 12px rgba(255, 0, 51, 0.55); }
  </style>
</head>
<body>
  <main class="showcase-card">
    <div class="showcase-header">
      <h1 class="showcase-title">Botanical Tarot Health Bar</h1>
      <p id="status-readout" class="showcase-readout">HP: 100 / 100 · Shield: 0 · Normal</p>
    </div>

    <!-- AAA Botanical Health Bar Component -->
    <div id="botanical-healthbar" class="hud-healthbar" role="meter" aria-label="Player Health" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
      <div class="hp-track">
        <div class="hp-ghost-fill"></div>
        <div class="hp-main-fill"></div>
        <div class="shield-fill" data-empty="true"></div>
      </div>
      <div class="healthbar-frame-overlay" aria-hidden="true"></div>
      <div class="heart-icon" aria-hidden="true"></div>
    </div>

    <!-- Demo Control Buttons -->
    <div class="demo-controls">
      <button type="button" id="btn-damage" class="demo-btn btn-damage">Damage -20</button>
      <button type="button" id="btn-heal" class="demo-btn btn-heal">Heal +15</button>
      <button type="button" id="btn-shield" class="demo-btn btn-shield">Add Shield +30</button>
      <button type="button" id="btn-low-hp" class="demo-btn btn-critical" aria-pressed="false">Toggle Low HP</button>
    </div>
  </main>

  <script>
    class BotanicalHealthBar {
      constructor(el, maxHp = 100) {
        this.el = el;
        this.maxHp = maxHp;
        this.hp = maxHp;
        this.ghostHp = maxHp;
        this.shield = 0;
        this.forcedLow = false;
        this.savedHpBeforeLow = null;
        this.damageTimer = null;
        this.healTimer = null;
        this.shatterTimer = null;
        this.ghostTimer = null;
        this.render();
      }

      takeDamage(amount) {
        const dmg = Math.max(0, Number(amount) || 0);
        if (dmg <= 0) return;

        const prevShield = this.shield;
        const absorbed = Math.min(prevShield, dmg);
        this.shield = Math.max(0, prevShield - absorbed);
        const remaining = Math.max(0, dmg - absorbed);

        this.ghostHp = Math.max(this.ghostHp, this.hp);
        this.hp = Math.max(0, this.hp - remaining);
        if (this.hp / this.maxHp >= 0.25) this.forcedLow = false;

        this.render();

        if (prevShield > 0 && this.shield === 0) {
          this.triggerClass('shield-shatter', 'shatterTimer', 300);
        }
        this.triggerClass('is-damaged', 'damageTimer', 240);

        clearTimeout(this.ghostTimer);
        this.ghostTimer = setTimeout(() => {
          this.ghostHp = this.hp;
          this.render();
        }, 30);
      }

      heal(amount) {
        const add = Math.max(0, Number(amount) || 0);
        this.hp = Math.min(this.maxHp, this.hp + add);
        this.ghostHp = this.hp;
        if (this.hp / this.maxHp >= 0.25) {
          this.forcedLow = false;
          this.savedHpBeforeLow = null;
        }
        this.render();
        this.triggerClass('is-healing', 'healTimer', 600);
      }

      addShield(amount) {
        const add = Math.max(0, Number(amount) || 0);
        this.shield = Math.min(this.maxHp, this.shield + add);
        this.el.classList.remove('shield-shatter');
        this.render();
      }

      setLowHealth(bool) {
        const isLow = Boolean(bool);
        if (isLow) {
          if (this.hp / this.maxHp >= 0.25) {
            this.savedHpBeforeLow = this.hp;
            this.hp = Math.max(1, Math.round(this.maxHp * 0.18));
            this.ghostHp = this.hp;
          }
          this.forcedLow = true;
        } else {
          this.forcedLow = false;
          if (this.hp / this.maxHp < 0.25) {
            this.hp = this.savedHpBeforeLow && this.savedHpBeforeLow >= this.maxHp * 0.25
              ? this.savedHpBeforeLow
              : Math.round(this.maxHp * 0.85);
            this.ghostHp = this.hp;
          }
          this.savedHpBeforeLow = null;
        }
        this.render();
      }

      isCritical() {
        return this.forcedLow || (this.hp / this.maxHp) < 0.25;
      }

      triggerClass(className, timerProp, durationMs) {
        this.el.classList.remove(className);
        void this.el.offsetWidth;
        this.el.classList.add(className);
        clearTimeout(this[timerProp]);
        this[timerProp] = setTimeout(() => {
          this.el.classList.remove(className);
        }, durationMs);
      }

      render() {
        const hpPct = Math.max(0, Math.min(100, (this.hp / this.maxHp) * 100));
        const ghostPct = Math.max(hpPct, Math.min(100, (this.ghostHp / this.maxHp) * 100));
        const shieldPct = Math.max(0, Math.min(100, (this.shield / this.maxHp) * 100));
        const hasShield = this.shield > 0;
        const critical = this.isCritical();

        this.el.style.setProperty('--hp-pct', `${hpPct.toFixed(2)}%`);
        this.el.style.setProperty('--ghost-pct', `${ghostPct.toFixed(2)}%`);
        this.el.style.setProperty('--shield-pct', `${shieldPct.toFixed(2)}%`);

        this.el.classList.toggle('has-shield', hasShield);
        this.el.classList.toggle('is-critical', critical);
        this.el.setAttribute('aria-valuenow', String(Math.round(this.hp)));

        const shieldFill = this.el.querySelector('.shield-fill');
        if (shieldFill) {
          shieldFill.setAttribute('data-empty', String(!hasShield));
        }

        const btnLow = document.getElementById('btn-low-hp');
        if (btnLow) {
          btnLow.setAttribute('aria-pressed', String(critical));
        }

        const readout = document.getElementById('status-readout');
        if (readout) {
          const states = [];
          if (hasShield) states.push('Shield Active');
          if (critical) states.push('Critical (<25% HP)');
          if (!states.length) states.push('Normal');
          readout.textContent = `HP: ${Math.round(this.hp)} / ${this.maxHp} · Shield: ${Math.round(this.shield)} · ${states.join(' · ')}`;
        }
      }
    }

    const controller = new BotanicalHealthBar(document.getElementById('botanical-healthbar'), 100);
    window.healthBar = controller;
    window.takeDamage = (amt) => controller.takeDamage(amt);
    window.heal = (amt) => controller.heal(amt);
    window.addShield = (amt) => controller.addShield(amt);
    window.setLowHealth = (bool) => controller.setLowHealth(bool);

    document.getElementById('btn-damage').addEventListener('click', () => controller.takeDamage(20));
    document.getElementById('btn-heal').addEventListener('click', () => controller.heal(15));
    document.getElementById('btn-shield').addEventListener('click', () => controller.addShield(30));
    document.getElementById('btn-low-hp').addEventListener('click', () => controller.setLowHealth(!controller.isCritical()));
  </script>
</body>
</html>
